  // Compress image to stay under nginx body limit (~1MB default)
  async function compressImage(file, maxSizeKB = 900, maxDim = 1600) {
    return new Promise((resolve) => {
      // Skip if already small enough
      if (file.size <= maxSizeKB * 1024) { resolve(file); return; }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        // Try quality levels until under limit
        const tryQuality = (q) => {
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            if (!blob) { resolve(file); return; }
            if (blob.size > maxSizeKB * 1024 && q > 0.3) {
              tryQuality(q - 0.1);
              return;
            }
            try {
              resolve(new File([blob], file.name || 'image.jpg', { type: 'image/jpeg' }));
            } catch {
              blob.name = file.name || 'image.jpg';
              resolve(blob);
            }
          }, 'image/jpeg', q);
        };
        tryQuality(0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  // Remove mobile chrome (status bar, browser bar, bottom nav, payment row) before sending to Claude
  // Mobile portrait screenshots (aspect ratio > 1.6) get top 5% + bottom 8% trimmed.
  async function preCropMobileChrome(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const ratio = img.naturalHeight / img.naturalWidth;
        if (ratio <= 1.6) {
          URL.revokeObjectURL(url);
          console.log('[preCrop] not mobile (ratio=' + ratio.toFixed(2) + '), keeping original');
          resolve(file);
          return;
        }
        const topCropPct = 0.05;
        const bottomCropPct = 0.08;
        const cropY = Math.floor(img.naturalHeight * topCropPct);
        const cropH = Math.floor(img.naturalHeight * (1 - topCropPct - bottomCropPct));
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = cropH;
        canvas.getContext('2d').drawImage(img, 0, cropY, img.naturalWidth, cropH, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          if (!blob) { resolve(file); return; }
          try {
            const newFile = new File([blob], file.name || 'cart.jpg', { type: 'image/jpeg' });
            console.log(`[preCrop] mobile detected (ratio=${ratio.toFixed(2)}), trimmed ${Math.round((topCropPct + bottomCropPct) * 100)}% chrome, new size: ${canvas.width}x${canvas.height}`);
            resolve(newFile);
          } catch (e) {
            // Safari fallback: File constructor may throw, use Blob with name property
            console.warn('[preCrop] File constructor failed, using Blob fallback:', e.message);
            blob.name = file.name || 'cart.jpg';
            resolve(blob);
          }
        }, 'image/jpeg', 0.92);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function cropProductImages(file, products) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const PAD = 0.10; // 10% padding — height is now derived from spacing, less drift expected
        const results = products.map(p => {
          const canvas = document.createElement('canvas');
          const rawX = (p.xPct / 100) * img.naturalWidth;
          const rawY = (p.yPct / 100) * img.naturalHeight;
          const rawW = (p.widthPct / 100) * img.naturalWidth;
          const rawH = (p.heightPct / 100) * img.naturalHeight;
          const padX = rawW * PAD;
          const padY = rawH * PAD;
          const x = Math.max(0, rawX - padX);
          const y = Math.max(0, rawY - padY);
          const w = Math.min(img.naturalWidth - x, rawW + padX * 2);
          const h = Math.min(img.naturalHeight - y, rawH + padY * 2);
          canvas.width = Math.max(w, 1);
          canvas.height = Math.max(h, 1);
          canvas.getContext('2d').drawImage(img, x, y, w, h, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL('image/jpeg', 0.85);
        });
        URL.revokeObjectURL(url);
        resolve(results);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve([]); };
      img.src = url;
    });
  }


  function isXemGio(text) {
    if (!text) return false;
    const t = text.toLowerCase().trim();
    const n = t.replace(/\s/g, '');
    // Exact/compound matches (no spaces)
    if (n.includes('xemgiỏ') || n.includes('xemgio') || n.includes('giỏhàng') || n.includes('giohang')
      || n.includes('xemđơn') || n.includes('xemdon') || n.includes('đơnhàng') || n.includes('donhang')
      || n.includes('kiểmtra') || n.includes('kiemtra') || n.includes('tổngđơn') || n.includes('tongdon')
      || n.includes('tổngtiền') || n.includes('tongtien') || n.includes('checkbag')) return true;
    // Short keyword matches — only when message is brief (≤ 5 words) to avoid false positives
    const words = t.split(/\s+/);
    if (words.length <= 5) {
      const shortKeys = ['giỏ', 'gio', 'đơn', 'don', 'cart', 'check', 'xem', 'summary', 'tổng', 'tong', 'kiểm', 'kiem', 'review'];
      if (shortKeys.some(k => words.includes(k))) return true;
    }
    return false;
  }

  function isOnlyLinks(text) {
    if (!text) return false;
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);
    return lines.length > 0 && lines.every(l => l.startsWith('http'));
  }

  function getItemSalePct(item, globalSalePct) {
    if (item.noSale) return 0;
    if (item.itemSalePct != null) return item.itemSalePct;
    return globalSalePct;
  }

  function calcCartTotal(items, salePct = 0) {
    const totals = {};
    for (const item of items) {
      if (!item.price) continue;
      const cur = (item.currency || '').trim() || '?';
      const pct = getItemSalePct(item, salePct);
      const price = pct > 0 ? item.price * (1 - pct / 100) : item.price;
      totals[cur] = (totals[cur] || 0) + (price * (item.quantity || 1));
    }
    return totals;
  }

  function formatTotal(totals) {
    const suffixCurrencies = ['đ', 'VND', '₫'];
    return Object.entries(totals).map(([cur, total]) => {
      if (cur === '?') return total.toLocaleString();
      if (suffixCurrencies.includes(cur)) return total.toLocaleString('vi-VN') + cur;
      return cur + total.toLocaleString();
    }).join(' + ');
  }

  function effectivePrice(item, salePct) {
    if (!item.price) return item.price;
    const pct = getItemSalePct(item, salePct);
    return pct > 0 ? Math.round(item.price * (1 - pct / 100) * 100) / 100 : item.price;
  }

  function renderCartSummary(session) {
    console.log('[RENDER CART] items:', JSON.stringify(session.items.map(i => ({name: i.name, link: i.link}))));
    if (session.items.length === 0) {
      return 'Giỏ hàng trống. Vui lòng upload ảnh sản phẩm.';
    }
    const salePct = session.salePct || 0;
    const lines = session.items.map((item, i) => {
      const vars = (item.variations || []).map(v => `${v.name}: ${v.value}`).join(', ');
      const linkLine = item.link ? `🔗 ${item.link}` : '⚠️ Chưa có link';
      const itemPct = getItemSalePct(item, salePct);
      const priceDisplay = itemPct > 0
        ? `${formatPrice(item)} → ${formatPrice({...item, price: effectivePrice(item, salePct)})} (-${itemPct}%${item.itemSalePct != null ? ' riêng' : ''})`
        : formatPrice(item) + (item.noSale && salePct > 0 ? ' (miễn sale)' : '');
      return `${i + 1}. ${item.name}\n   Qty: ${item.quantity} | ${priceDisplay}${vars ? '\n   ' + vars : ''}\n   ${linkLine}`;
    }).join('\n\n');
    const missing = session.items.filter(i => !i.link).length;
    const warning = missing > 0 ? `\n\n⚠️ ${missing} sản phẩm chưa có link. Gửi link bổ sung để cập nhật.` : '\n\n✅ Tất cả sản phẩm đã có link.';
    const totals = calcCartTotal(session.items, salePct);
    const totalLine = Object.keys(totals).length > 0 ? `\n💰 Tổng${salePct > 0 ? ` (sau -${salePct}%)` : ''}: ${formatTotal(totals)}` : '';
    const saleHint = salePct > 0 ? `\n🏷️ Đang áp dụng giảm giá ${salePct}% toàn đơn` : '';
    const editHint = `\n\n─────────────────\n✏️  sửa N tên/qty/giá/link: <giá trị>\n✏️  sửa N size/color/fit/width/...: <giá trị>\n🗑️  xóa N\n💸  giảm N% | bỏ giảm giá | sale #N M% | bỏ sale #N`;
    return `📦 Giỏ hàng (${session.items.length} sản phẩm):${saleHint}\n\n${lines}${warning}${totalLine}${editHint}`;
  }

  // ===== INTERACTIVE CART =====
  function buildInlineCartHtml() {
    const session = getActiveSession();
    if (!session || session.items.length === 0) return '<div class="cart-panel" style="display:block;border:none;padding:8px 0;">Giỏ hàng trống.</div>';
    const totals = calcCartTotal(session.items, session.salePct || 0);
    const totalStr = Object.keys(totals).length > 0 ? formatTotal(totals) : '';
    const cards = session.items.map((item, i) => renderCartCard(item, i, session)).join('');
    return `
      <div class="cart-panel" style="display:block;border:none;max-height:none;padding:8px 0;">
        <div class="cart-header">
          <span class="cart-title">Giỏ hàng (${session.items.length} sản phẩm)</span>
          <span class="cart-total">${totalStr}</span>
        </div>
        <div class="cart-cards">${cards}</div>
        <div class="cart-actions" style="justify-content:space-between">
          <div style="display:flex;gap:8px;align-items:center">
            <button class="cart-btn" style="background:#EFE7FF;color:#7C5ACB" onclick="applySaleUI()">Giảm giá ${session.salePct ? session.salePct + '%' : ''}</button>
            ${session.salePct > 0 ? `<button class="cart-btn" style="background:#FDEBEC;color:#D95C5C" onclick="removeSaleUI()">Bỏ giảm giá</button>` : ''}
          </div>
          <div style="display:flex;gap:10px">
            <button class="cart-btn cart-btn-clear" onclick="clearCartUI()">Xóa giỏ hàng</button>
            <button class="cart-btn cart-btn-order" onclick="submitOrder(getActiveSession())">Tạo đơn</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderCart() {
    const el = document.getElementById('inlineCart');
    if (el) {
      el.innerHTML = buildInlineCartHtml();
    } else {
      // Nếu không tìm thấy inlineCart, re-render toàn bộ messages
      renderMessages();
    }
  }

  function invalidateOldCarts() {
    const session = getActiveSession();
    if (!session) return;
    session.messages = session.messages.filter(m => !m.cartView);
  }

  function ensureCartMessage() {
    const session = getActiveSession();
    if (!session) return;
    // Xóa cart messages cũ trước khi tạo mới
    invalidateOldCarts();
    session.messages.push({ role: 'ai', text: '', cartView: true, timestamp: Date.now() });
    renderMessages();
    saveSessions();
  }

  function renderCartCard(item, i, session) {
    const vars = (item.variations || []).map((v, vi) =>
      `<span class="cart-field" onclick="editCartField(${i},'var',${vi})">
        <span class="cart-field-label">${escapeHtml(v.name)}</span>
        <span class="cart-field-value">${escapeHtml(v.value)}</span>
      </span>`
    ).join('');
    const pct = getItemSalePct(item, session.salePct || 0);
    const ep = effectivePrice(item, session.salePct || 0);
    const priceShow = pct > 0 ? `<s>${formatPrice(item)}</s> ${formatPrice({...item, price: ep})} (-${pct}%)` : formatPrice(item);
    const linkShow = item.link ? item.link.substring(0, 40) + (item.link.length > 40 ? '...' : '') : '⚠️ chưa có link';
    const thumbSrc = item.thumb || (item.image_path ? (item.image_path.startsWith('http') ? item.image_path : 'https://basso.vn' + item.image_path) : '');
      const thumbHtml = thumbSrc ? `<img class="cart-card-thumb" src="${thumbSrc}" />` : '';
    const shortName = item.name.length > 30 ? item.name.substring(0, 30) + '...' : item.name;
    return `<div class="cart-card" id="cartCard${i}">
      <div class="cart-card-compact" onclick="toggleCardExpand(${i})">
        <span class="cart-card-num">${i+1}.</span>
        ${thumbHtml}
        <span class="cart-card-compact-name">${escapeHtml(shortName)}</span>
        <span class="cart-card-compact-price">${priceShow}</span>
        <span class="cart-card-compact-arrow">▼</span>
      </div>
      <div class="cart-card-details">
        <div class="cart-card-fields" style="margin-top:0">
          <span class="cart-card-num hide-mobile">${i+1}.</span>
          ${thumbHtml ? `<span class="hide-mobile">${thumbHtml}</span>` : ''}
          <span class="cart-field" onclick="editCartField(${i},'name')" style="flex:1;min-width:0;margin-right:28px">
            <span class="cart-field-label">Tên</span>
            <span class="cart-field-value" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(item.name)}</span>
          </span>
        </div>
        <div class="cart-card-fields">
          <span class="cart-field" onclick="editCartField(${i},'quantity')">
            <span class="cart-field-label">Qty</span>
            <span class="cart-field-value">${item.quantity || 1}</span>
          </span>
          <span class="cart-field" onclick="editCartField(${i},'price')">
            <span class="cart-field-label">Giá</span>
            <span class="cart-field-value">${priceShow}</span>
          </span>
          <span class="cart-field" onclick="editCartField(${i},'itemSale')" style="color:${item.itemSalePct ? '#e55' : '#999'}">
            <span class="cart-field-label">Sale</span>
            <span class="cart-field-value">${item.noSale ? 'Miễn' : item.itemSalePct ? item.itemSalePct + '%' : '—'}</span>
          </span>
          ${(session.salePct > 0 && !item.noSale && !item.itemSalePct) ? `<span class="cart-field" onclick="toggleNoSale(${i})" style="color:#e55;font-size:11px;cursor:pointer"><span class="cart-field-value">Miễn sale</span></span>` : ''}
          ${item.noSale ? `<span class="cart-field" onclick="toggleNoSale(${i})" style="color:#28a745;font-size:11px;cursor:pointer"><span class="cart-field-value">Áp sale lại</span></span>` : ''}
          <span class="cart-field" onclick="editCartField(${i},'link')" style="flex:1;min-width:0;max-width:calc(100% - 40px)">
            <span class="cart-field-label">Link</span>
            <span class="cart-field-value" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(linkShow)}</span>
          </span>
          ${vars}
          <span class="cart-field" onclick="editCartField(${i},'note')" style="color:${item.note ? '#333' : '#999'}">
            <span class="cart-field-label">Note</span>
            <span class="cart-field-value" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.note ? escapeHtml(item.note) : '—'}</span>
          </span>
          <span class="cart-field" onclick="addCartVariation(${i})" style="color:#7c5cbf;cursor:pointer;font-size:12px">
            <span class="cart-field-value">+ Variant</span>
          </span>
        </div>
        <button class="cart-card-delete" onclick="deleteCartItem(${i})" title="Xóa"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
      </div>
    </div>`;
  }

  let _editModalCallback = null;

  var _variantItemIdx = null;
  function addCartVariation(idx) {
    _variantItemIdx = idx;
    document.getElementById('variantName').value = '';
    document.getElementById('variantValue').value = '';
    document.getElementById('variantModal').classList.add('show');
    setTimeout(() => document.getElementById('variantName').focus(), 100);
  }
  function closeVariantModal() {
    document.getElementById('variantModal').classList.remove('show');
    _variantItemIdx = null;
  }
  function saveVariantModal() {
    const name = document.getElementById('variantName').value.trim();
    const value = document.getElementById('variantValue').value.trim();
    if (!name) return;
    const session = getActiveSession();
    if (!session || _variantItemIdx === null || !session.items[_variantItemIdx]) return;
    const item = session.items[_variantItemIdx];
    if (!item.variations) item.variations = [];
    item.variations.push({ name, value });
    saveSessions();
    closeVariantModal();
    renderCart();
  }

  function editCartField(idx, field, varIdx) {
    const session = getActiveSession();
    if (!session || !session.items[idx]) return;
    const item = session.items[idx];
    let currentVal, label;
    if (field === 'var') {
      const v = item.variations[varIdx];
      label = v.name;
      currentVal = v.value;
    } else if (field === 'name') {
      label = 'Tên sản phẩm'; currentVal = item.name;
    } else if (field === 'quantity') {
      label = 'Số lượng'; currentVal = item.quantity || 1;
    } else if (field === 'price') {
      label = 'Giá'; currentVal = item.price || 0;
    } else if (field === 'itemSale') {
      label = 'Giảm giá riêng (%)'; currentVal = item.itemSalePct || 0;
    } else if (field === 'note') {
      label = 'Ghi chú'; currentVal = item.note || '';
    } else if (field === 'link') {
      label = 'Link sản phẩm'; currentVal = item.link || '';
    }
    openEditModal(`Sửa ${label} (#${idx+1})`, currentVal, (newVal) => {
      if (newVal === String(currentVal)) return;
      if (field === 'var') {
        item.variations[varIdx].value = newVal;
      } else if (field === 'name') {
        item.name = newVal;
      } else if (field === 'quantity') {
        item.quantity = parseInt(newVal) || 1;
      } else if (field === 'price') {
        item.price = parseFloat(newVal) || 0;
      } else if (field === 'note') {
        item.note = newVal;
      } else if (field === 'itemSale') {
        const pct = parseFloat(newVal) || 0;
        item.itemSalePct = pct > 0 ? pct : undefined;
        item.noSale = false;
      } else if (field === 'link') {
        // Validate domain
        const session = getActiveSession();
        const cartDomain = getCartDomain(session);
        const newDomain = getDomainFromUrl(newVal);
        if (cartDomain && newDomain && newDomain !== cartDomain) {
          addMessage('ai', `Không thể thêm link này vì domain (${newDomain}) không trùng với đơn hàng hiện tại (${cartDomain}).`);
          return;
        }
        item.link = newVal;
      }
      saveSessions();
      renderCart();
    });
  }

  function openEditModal(title, value, callback) {
    _editModalCallback = callback;
    document.getElementById('editModalTitle').textContent = title;
    const input = document.getElementById('editModalInput');
    input.value = value;
    document.getElementById('editModal').classList.add('show');
    setTimeout(() => { input.focus(); input.select(); }, 100);
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
    _editModalCallback = null;
  }

  function saveEditModal() {
    const val = document.getElementById('editModalInput').value.trim();
    if (_editModalCallback && val !== '') _editModalCallback(val);
    closeEditModal();
  }

  // Enter to save, Escape to cancel
  var _editInput = document.getElementById('editModalInput');
  if (_editInput) _editInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveEditModal(); }
    if (e.key === 'Escape') closeEditModal();
  });

  function deleteCartItem(idx) {
    const session = getActiveSession();
    if (!session) return;
    session.items.splice(idx, 1);
    saveSessions();
    renderCart();
  }

  var _confirmCallback = null;

  function showConfirm(title, text, btnText, callback) {
    _confirmCallback = callback;
    document.getElementById('confirmModalTitle').textContent = title;
    document.getElementById('confirmModalText').textContent = text;
    document.getElementById('confirmModalBtn').textContent = btnText;
    document.getElementById('confirmModal').classList.add('show');
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('show');
    _confirmCallback = null;
  }

  function doConfirmModal() {
    if (_confirmCallback) _confirmCallback();
    closeConfirmModal();
  }

  function toggleCardExpand(idx, prefix) {
    const id = (prefix || 'cartCard') + idx;
    const card = document.getElementById(id);
    if (card) card.classList.toggle('expanded');
  }

  function toggleNoSale(idx) {
    const session = getActiveSession();
    if (!session || !session.items[idx]) return;
    session.items[idx].noSale = !session.items[idx].noSale;
    if (session.items[idx].noSale) delete session.items[idx].itemSalePct;
    saveSessions();
    renderCart();
  }

  function applySaleUI() {
    const session = getActiveSession();
    if (!session) return;
    openEditModal('Giảm giá toàn đơn (%)', session.salePct || 0, (val) => {
      const pct = parseFloat(val) || 0;
      session.salePct = pct;
      saveSessions();
      renderCart();
    });
  }

  function removeSaleUI() {
    const session = getActiveSession();
    if (!session) return;
    session.salePct = 0;
    saveSessions();
    renderCart();
  }

  function clearCartUI() {
    const session = getActiveSession();
    if (!session || session.items.length === 0) return;
    showConfirm('Xóa giỏ hàng', `Bạn có chắc muốn xóa toàn bộ ${session.items.length} sản phẩm khỏi giỏ hàng?`, 'Xóa', () => {
      invalidateOldCarts();
      session.items = [];
      session.salePct = 0;
      saveSessions();
      renderMessages();
      addMessage('ai', 'Đã xóa toàn bộ giỏ hàng.');
    });
  }

  // ===== UTILS =====
  function fileToDataUrl(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function toggleSidebar() {
    const open = document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
    document.querySelector('.btn-hamburger').style.display = open ? 'none' : '';
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
    document.querySelector('.btn-hamburger').style.display = '';
  }

  function logout() {
    localStorage.removeItem('ai_chat_user');
    sessionStorage.removeItem('ai_chat_user');
    window.location.href = 'login.html';
  }

  function formatPrice(item) {
    const price = item.price;
    const currency = (item.currency || '').trim();
    if (price === undefined || price === null || price === '') return '';
    const suffixCurrencies = ['đ', 'VND', '₫'];
    if (!currency) return price.toLocaleString();
    if (suffixCurrencies.includes(currency)) {
      return price.toLocaleString('vi-VN') + currency;
    }
    return currency + price.toLocaleString();
  }

  function parseEditCommand(text) {
    if (!text) return null;
    const t = text.trim();

    // Xóa nhiều: "xóa #1, #2, #3" hoặc "xóa #1 #2 #3" hoặc "xóa #1, xóa #2"
    const bulkDel = t.match(/^(xóa|xoa|xoá)\s+(.+)/i);
    if (bulkDel) {
      const nums = [...bulkDel[2].matchAll(/#?(\d+)/g)].map(m => parseInt(m[1]) - 1);
      if (nums.length > 1) return { action: 'deleteMany', indices: nums };
      if (nums.length === 1) return { action: 'delete', index: nums[0] };
    }

    // Sửa #N fieldname: value (field bất kỳ, dùng : làm phân cách)
    const edit = t.match(/^(sửa|sua|edit)\s+#?(\d+)\s+([^:]+?)\s*:\s*(.+)/i);
    if (!edit) return null;

    const rawField = edit[3].trim().toLowerCase();
    const fieldMap = {
      'tên': 'name', 'ten': 'name', 'name': 'name',
      'qty': 'quantity', 'số lượng': 'quantity', 'so luong': 'quantity',
      'giá': 'price', 'gia': 'price', 'price': 'price',
      'link': 'link',
    };

    const field = fieldMap[rawField];
    if (field) return { action: 'edit', index: parseInt(edit[2]) - 1, field, value: edit[4].trim() };

    // Không phải field cố định → treat as variation name
    const varName = edit[3].trim().replace(/\b\w/g, c => c.toUpperCase());
    return { action: 'edit', index: parseInt(edit[2]) - 1, field: 'variation', variationName: varName, value: edit[4].trim() };
  }

  function parsePriceInput(str) {
    let s = str.trim();
    const prefixes = ['$', '€', '£', '₩', '¥', '₫'];
    const suffixes = ['VND', 'vnd', 'đ'];
    let currency = '';

    for (const c of prefixes) {
      if (s.startsWith(c)) { currency = c; s = s.slice(c.length).trim(); break; }
    }
    if (!currency) {
      for (const c of suffixes) {
        if (s.toLowerCase().endsWith(c.toLowerCase())) {
          currency = c === 'vnd' ? 'VND' : c;
          s = s.slice(0, -c.length).trim();
          break;
        }
      }
    }
    const price = parseFloat(s.replace(/[,\s]/g, ''));
    return { price: isNaN(price) ? null : price, currency };
  }

  function getAuthHeaders() {
    const user = JSON.parse(localStorage.getItem('ai_chat_user') || sessionStorage.getItem('ai_chat_user') || 'null');
    if (!user || !user.token) return {};
    const headers = { 'Authorization': `Bearer ${user.token}` };
    if (user.id) headers['X-User-Id'] = String(user.id);
    return headers;
  }

  function translateError(msg) {
    if (!msg) return 'Lỗi không xác định';
    // Auto-logout khi token hết hạn
    if (/unauthorized|expired.*token|invalid.*token/i.test(msg)) {
      addMessage('ai', 'Phiên đăng nhập đã hết hạn. Đang chuyển về trang đăng nhập...');
      setTimeout(() => {
        localStorage.removeItem('ai_chat_user');
        sessionStorage.removeItem('ai_chat_user');
        window.location.replace('login.html');
      }, 2000);
    }
    const map = {
      'Product link is required': 'Sản phẩm thiếu link',
      'Not exist user with this id': 'Khách hàng không tồn tại',
      'Unauthorized': 'Phiên đăng nhập hết hạn',
      'Invalid or expired partner access token': 'Token hết hạn',
      'Unexpected end of JSON input': 'Server không phản hồi, vui lòng thử lại',
      'update_items: không có field hợp lệ để cập nhật': 'Không có thay đổi hợp lệ để cập nhật',
    };
    let result = msg;
    for (const [en, vi] of Object.entries(map)) {
      result = result.replace(new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), vi);
    }
    return result;
  }

  // ===== SEARCH MESSAGES IN CURRENT SESSION =====
  function searchMessages() {
    const q = (document.getElementById('msgSearch').value || '').trim().toLowerCase();
    const clearBtn = document.getElementById('msgSearchClear');
    const countEl = document.getElementById('msgSearchCount');

    // Remove old highlights
    document.querySelectorAll('.msg-highlight').forEach(el => el.classList.remove('msg-highlight'));

    if (!q) {
      clearBtn.style.display = 'none';
      countEl.textContent = '';
      return;
    }
    clearBtn.style.display = '';

    const session = getActiveSession();
    if (!session || !session.messages) { countEl.textContent = ''; return; }

    // Find matching message indices
    const matches = [];
    session.messages.forEach((m, i) => {
      if (m.text && m.text.toLowerCase().includes(q)) matches.push(i);
    });

    countEl.textContent = matches.length > 0 ? matches.length + ' kết quả' : 'Không tìm thấy';

    // Highlight matching messages in DOM
    const msgList = document.getElementById('messageList');
    const msgEls = msgList.querySelectorAll('.message');
    matches.forEach(idx => {
      if (msgEls[idx]) msgEls[idx].classList.add('msg-highlight');
    });

    // Scroll to first match
    if (matches.length > 0 && msgEls[matches[0]]) {
      msgEls[matches[0]].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function clearMsgSearch() {
    document.getElementById('msgSearch').value = '';
    document.getElementById('msgSearchClear').style.display = 'none';
    document.getElementById('msgSearchCount').textContent = '';
    document.querySelectorAll('.msg-highlight').forEach(el => el.classList.remove('msg-highlight'));
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

<!-- Edit Modal -->
<div class="edit-modal-overlay" id="editModal">
  <div class="edit-modal">
    <div class="edit-modal-title" id="editModalTitle"></div>
    <input class="edit-modal-input" id="editModalInput" autocomplete="off" />
    <div class="edit-modal-btns">
      <button class="edit-modal-btn edit-modal-btn-cancel" onclick="closeEditModal()">Hủy</button>
      <button class="edit-modal-btn edit-modal-btn-save" onclick="saveEditModal()">Lưu</button>
    </div>
  </div>
</div>

<!-- Add Variant Modal -->
<div class="edit-modal-overlay" id="variantModal">
  <div class="edit-modal">
    <div class="edit-modal-title">Thêm thuộc tính</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input class="edit-modal-input" id="variantName" placeholder="Tên (vd: Size, Color...)" style="flex:1" />
      <input class="edit-modal-input" id="variantValue" placeholder="Giá trị (vd: M, Red...)" style="flex:1" />
    </div>
    <div class="edit-modal-btns">
      <button class="edit-modal-btn edit-modal-btn-cancel" onclick="closeVariantModal()">Hủy</button>
      <button class="edit-modal-btn edit-modal-btn-save" onclick="saveVariantModal()">Lưu</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="edit-modal-overlay" id="confirmModal">
  <div class="edit-modal">
    <div class="edit-modal-title" id="confirmModalTitle"></div>
    <div class="confirm-modal-text" id="confirmModalText"></div>
    <div class="edit-modal-btns">
      <button class="edit-modal-btn edit-modal-btn-cancel" onclick="closeConfirmModal()">Không</button>
      <button class="edit-modal-btn edit-modal-btn-danger" id="confirmModalBtn" onclick="doConfirmModal()">Xóa</button>
    </div>
  </div>
</div>

<script>
  // Set exact viewport height for all platforms
  function setAppHeight() {
    document.body.style.height = window.innerHeight + 'px';
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);

  // Service worker
  if ('serviceWorker' in navigator) {
    const base = new URL('./', window.location.href);
    const swUrl = new URL('sw.js', base.href);
    navigator.serviceWorker.register(swUrl.href, { scope: base.href, updateViaCache: 'none' })
      .then((reg) => {
        // Check for SW updates on every page load
        reg.update().catch(() => {});
        // When a new SW takes control, reload once so the user gets the fresh HTML/JS
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
        // If a new SW is waiting, tell it to activate immediately
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('SKIP_WAITING');
            }
          });
        });
      })
      .catch(() => {});
  }
</script>
